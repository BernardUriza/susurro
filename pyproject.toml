[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escucha"
version = "1.0.0"
description = "Motor de escucha — SSOT de captura de micrófono + segmentación por voz + transcripción local (hear → Susurro Gateway)"
requires-python = ">=3.10"

[project.scripts]
dictar = "escucha.dictar:main"

[tool.setuptools]
packages = ["escucha"]
