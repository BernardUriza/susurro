[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escucha"
version = "1.0.0"
description = "Motor de escucha — SSOT de captura de micrófono + segmentación por voz + transcripción local (hear → Susurro Gateway)"
requires-python = ">=3.10"
dependencies = [
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "pywebrtc-audio>=0.2.0; sys_platform == 'win32'",
    "sherpa-onnx>=2.0.1; sys_platform == 'win32'",
]

[project.scripts]
dictar = "escucha.dictar:main"
transcribir = "escucha.archivo:main"

[tool.setuptools]
packages = ["escucha"]
